<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-pink-700 font-sans">
  <!-- Header -->
  <header class="shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-pink-600">Kitty🎀</h1>

      <nav class="hidden md:flex space-x-6 font-medium">
        <a href="#" class="hover:text-pink-500 transition">Home</a>
        <a href="#" class="hover:text-pink-500 transition">About</a>
        <a href="#" class="hover:text-pink-500 transition">Contact</a>
      </nav>

      <button class="bg-pink-500 hover:bg-pink-400 text-white px-5 py-2 rounded-full shadow-lg transition">
        Order Now
      </button>
    </div>
  </header>
  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-pink-100 to-pink-200 py-24">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <h2 class="text-4xl md:text-5xl font-bold text-pink-600 mb-6">
        Welcome to a Cute World 🌸
      </h2>
      <button class="bg-pink-500 hover:bg-pink-400 text-white px-8 py-3 rounded-full shadow-xl transition">
        Search Now
      </button>
    </div>
  </section>
  <!-- Features Section -->
  <section class="py-20 bg-pink-50">
    <div class="max-w-6xl mx-auto px-6">
      <h3 class="text-3xl font-bold text-center text-pink-600 mb-12">
        Cute Menu 💖
      </h3>
      <div class="grid md:grid-cols-3 gap-8">

        <div class="bg-white p-6 rounded-3xl shadow-lg text-center border-2 border-pink-200">
          <h4 class="text-xl font-semibold text-pink-600 mb-4">Cinnamoroll Cupcake</h4>
          <p class="text-pink-500">
            Soft pink tones with warm and gentle highlights.
          </p>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow-lg text-center border-2 border-pink-200">
          <h4 class="text-xl font-semibold text-pink-600 mb-4">Brownie Bun</h4>
          <p class="text-pink-500">
            Rich chocolate flavor with a cozy, comforting vibe.
          </p>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow-lg text-center border-2 border-pink-200">
          <h4 class="text-xl font-semibold text-pink-600 mb-4">Heart-shaped Cookies</h4>
          <p class="text-pink-500">
            Cute, and heartwarming treats that bring joy.
          </p>
        </div>
      </div>
    </div>
  </section>
  <!-- Footer -->
  <footer class="bg-pink-200 py-6">
    <div class="max-w-6xl mx-auto px-6 text-center text-pink-600">
      © 2026 Kitty. Made with 💕
    </div>
  </footer>
</body>
</html>
